# PR Checks — full pull-request gate.
# Static harness rules are defined once in scripts/validate-harness.sh and reused locally.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Validate agentic harness
        run: bash scripts/validate-harness.sh

  build-and-unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Publish unit test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Unit Test Report
          report_paths: "app/build/test-results/testDebugUnitTest/*.xml"
          detailed_summary: true
          include_passed: true
          require_tests: false

      - name: Android Lint
        run: ./gradlew lintDebug --console=plain
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  espresso:
    name: Espresso
    needs: [static-checks, build-and-unit]
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/espresso.yml

  maestro:
    name: Maestro
    needs: [static-checks, build-and-unit]
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/maestro-tests.yml
    with:
      flows: maestro/smoke

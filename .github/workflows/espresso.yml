name: Android Espresso Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  espresso-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest --console=plain
            test_exit_code=$?

            mkdir -p allure-results
            adb exec-out run-as com.si13.app sh -c 'cd /data/data/com.si13.app/files && tar cf - allure-results 2>/dev/null' > allure-results.tar || true
            if [ -s allure-results.tar ]; then
              tar xf allure-results.tar
            fi

            exit "$test_exit_code"

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.43.0

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --single-file --clean --output allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/index.html
          if-no-files-found: error
          retention-days: 7

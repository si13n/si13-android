name: Android Espresso Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  espresso-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the project
      - name: Checkout project
        uses: actions/checkout@v6

      # Install Java and restore Gradle cache
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Allow Gradle execution
      - name: Make Gradle executable
        run: chmod +x gradlew

      # Enable emulator acceleration
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Create emulator and run Espresso
      - name: Run Espresso test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-load
            -no-snapshot-save
            -no-metrics
          script: ./scripts/run-espresso-with-allure.sh

      # Show results in GitHub Actions
      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Espresso Test Report
          report_paths: "app/build/outputs/androidTest-results/connected/**/*.xml"
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true

      # Build a browsable Allure report from the files collected by the emulator run.
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.43.0

      - name: Generate Allure report
        if: always()
        run: |
          if find allure-results -type f | grep -q .; then
            allure generate allure-results --single-file --clean --output allure-report
          else
            echo "No Allure result files were collected from the emulator."
            exit 1
          fi

      - name: Upload Allure report
        id: upload-allure-report
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Publish Allure report link
        if: always() && steps.upload-allure-report.outputs.artifact-url != ''
        run: |
          {
            echo "### Allure Report"
            echo ""
            echo "[Download the Allure report artifact](${{ steps.upload-allure-report.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Save the full Android HTML report
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: espresso-html-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7

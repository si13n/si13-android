name: Android Espresso Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  espresso-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Espresso test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: ./scripts/run-espresso-with-allure.sh

      - name: Publish Espresso summary
        if: always()
        run: python3 scripts/write-espresso-summary.py

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.43.0

      - name: Generate Allure report
        if: always()
        run: |
          if find allure-results -type f | grep -q .; then
            allure generate allure-results --single-file --clean --output allure-report
          else
            echo "No Allure result files were collected from the emulator."
            exit 1
          fi

      - name: Upload Allure report
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/index.html
          if-no-files-found: error
          retention-days: 7
          archive: false

name: Android Espresso Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  espresso-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the project
      - name: Checkout project
        uses: actions/checkout@v6

      # Install Java and restore Gradle cache
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Allow Gradle execution
      - name: Make Gradle executable
        run: chmod +x gradlew

      # Enable emulator acceleration
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Create emulator and run Espresso
      - name: Run Espresso test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot-load
            -no-snapshot-save
            -no-metrics
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
